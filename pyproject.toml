[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-rag"
version = "0.1.0"
description = "Production-style RAG service: structure-aware chunking, hybrid retrieval (BM25 + dense, RRF), reranking, grounded answers with citations, and an evaluation harness with a CI quality gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pypdf>=4"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docqa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the full pipeline on the bundled sample corpus"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines are handled by formatting, not linting
